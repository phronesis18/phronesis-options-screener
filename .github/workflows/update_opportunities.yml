name: Update Opportunities

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # ← Évite les runs trop longs (blocages)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Forcer l'installation des modules critiques (par sécurité)
          pip install yfinance pandas numpy scipy ib_insync pandas-ta python-dotenv requests

      - name: Run scan (limited symbols for speed)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          # Désactiver IBKR en CI pour éviter les timeouts
          DISABLE_IBKR: "true"
        run: python scripts/update_data.py

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update opportunities $(date -u +'%Y-%m-%d %H:%M:%S')"
          git push